name: Feature request
description: Propose a framework, Playground, or documentation improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What explanation or authoring problem cannot be handled cleanly today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed direction
      description: Describe the desired behavior and public API impact.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: What can be done with the existing primitives or scene contract?
